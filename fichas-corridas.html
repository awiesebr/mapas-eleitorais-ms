<title>Fichas corridas MS</title>
<style>
:root{--bg:#f6f4f1;--panel:#fff;--ink:#1f1a18;--ink-2:#5b524d;--line:#e3ddd7;--accent:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171514;--panel:#201d1b;--ink:#f4efeb;--ink-2:#c9c0b9;--line:#36312e;--accent:#f07a70;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px;width:min(340px,100%)}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--ink-2);font-size:14px}
input{font:inherit;font-size:20px;letter-spacing:.2em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 16px system-ui,sans-serif;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--accent);min-height:1.2em;font-size:14px}
</style>
</head>

</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pin){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function tryPin(pin,remember){
  const html=await open_(pin);
  if(remember){try{sessionStorage.setItem('mapas-pin',pin)}catch(e){}}
  show(html);
}
(async()=>{let s=null; try{s=sessionStorage.getItem('mapas-pin')}catch(e){} if(s){try{await tryPin(s,false)}catch(e){}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const b=document.getElementById('b'), err=document.getElementById('err');
  b.disabled=true; err.textContent='';
  try{await tryPin(document.getElementById('pin').value,true)}catch(x){err.textContent='PIN incorreto. Tente de novo.'; b.disabled=false;}
});
})();
</script>
